[project]
name = "polls"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "geopandas>=1.1.4",
    "httpx>=0.28.0",
    "nuee>=0.2.1",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "pyproj>=3.7.2",
    "pytrends>=4.9.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "shapely>=2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polls"]
